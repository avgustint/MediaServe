<div class="app-container">
  <!-- Location selection overlay (shown only when no location is configured) -->
  <div class="location-overlay" *ngIf="showLocationSelector">
    <div class="location-dialog">
      <h2>Select Location</h2>
      <p>Please select the location for this display.</p>

      <div *ngIf="locationsLoading">Loading locations...</div>
      <div *ngIf="!locationsLoading && locations.length">
        <select
          class="location-input"
          [(ngModel)]="locationInput"
        >
          <option [ngValue]="''" disabled>Select location</option>
          <option
            *ngFor="let location of locations"
            [ngValue]="location.guid.toString()"
          >
            {{ location.name }} ({{ location.guid }})
          </option>
        </select>
      </div>
      <div *ngIf="!locationsLoading && !locations.length">
        No locations available.
      </div>
      <div *ngIf="locationsError" class="location-error">
        {{ locationsError }}
      </div>

      <button class="location-confirm-button" (click)="onConfirmLocation()" [disabled]="!locationInput">
        Confirm
      </button>
    </div>
  </div>

  <div class="connection-status" [class.connected]="connectionStatus === 'connected'"></div>

  <!-- Text Content -->
  <div *ngIf="currentTextContent || nextTextContent" 
       class="content-container text-container" 
       [ngStyle]="textContainerStyle"
       [class.chords-hidden]="!showChords"
       #textContainer>
    <div class="text-pages"
         [class.show-page-0]="activeTextPageIndex === 0"
         [class.show-page-1]="activeTextPageIndex === 1">
      <!-- Page 0 (one of the two slide pages) -->
      <div class="text-page page-0">
        <div class="text-content"
             [ngStyle]="textContentStyleForPage(0)"
             [class.text-ready]="isTextReady && activeTextPageIndex === 0"
             [innerHTML]="getTextForPage(0) | formatText"
             [style.--chord-color]="getChordFontColorForPage(0)"></div>
      </div>

      <!-- Page 1 (the other slide page) -->
      <div class="text-page page-1">
        <div class="text-content"
             [ngStyle]="textContentStyleForPage(1)"
             [class.text-ready]="isTextReady && activeTextPageIndex === 1"
             [innerHTML]="getTextForPage(1) | formatText"
             [style.--chord-color]="getChordFontColorForPage(1)"></div>
      </div>
    </div>
  </div>

  <!-- Image Content -->
  <div *ngIf="currentContent?.type === 'image'" 
       class="content-container image-container" 
       [class.media-slide]="mediaSlideToggle"
       [ngStyle]="imageContainerStyle"
       #imageContainer>
    <img [src]="imageSrc" alt="Received image" class="display-image" [ngStyle]="imageStyle" />
  </div>

  <!-- URL Content (iframe with URL) -->
  <div *ngIf="currentContent?.type === 'url'" 
       class="content-container iframe-container"
       [class.media-slide]="mediaSlideToggle">
    <iframe #urlIframe
            [src]="safeUrl" 
            class="display-iframe" 
            frameborder="0"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"></iframe>
  </div>

  <!-- iFrame Content (pasted embed code) -->
  <div *ngIf="currentContent?.type === 'iframe'" 
       class="content-container iframe-embed-container"
       [class.media-slide]="mediaSlideToggle">
    <div class="iframe-embed-wrapper" [innerHTML]="safeIframeHtml"></div>
  </div>

  <!-- Video Content -->
  <div *ngIf="currentContent?.type === 'video'" 
       class="content-container video-container" 
       [class.media-slide]="mediaSlideToggle"
       [ngStyle]="videoContainerStyle"
       #videoContainer>
    <video #videoElement
            [src]="videoSrc" 
            class="display-video" 
            controls
            autoplay
            [ngStyle]="imageStyle"></video>
  </div>

  <!-- Loading spinner when not connected -->
  <div *ngIf="connectionStatus !== 'connected'" class="content-container no-content">
    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>
  </div>
</div>
