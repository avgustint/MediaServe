<div class="main-container" tabindex="0" (focus)="onMainContainerFocus()" (blur)="onMainContainerBlur()">
  <!-- Sidebar toggle button for mobile -->
  <button 
    class="sidebar-toggle-mobile" 
    [class.hidden]="sidebarOpen"
    (click)="toggleSidebar()" 
    [attr.aria-label]="'toggleSidebar' | translate"
  >
    <i class="fas fa-chevron-right"></i>
  </button>
  
  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>
  
  <div class="content-wrapper" [class.fullscreen]="isFullscreen">
    <div class="sidebar" [class.open]="sidebarOpen" [class.collapsed]="sidebarCollapsed" [class.hidden]="isFullscreen">
      <div class="sidebar-header">
        <div class="sidebar-header-content">
          <div class="tabs">
            <button
              class="tab-button icon-button tab-playlist"
              [class.active]="activeTab === 'playlist'"
              (click)="switchTab('playlist')"
              [title]="'playlist' | translate"
            >
              <i class="fas fa-list"></i>
            </button>
            <button
              class="tab-button icon-button"
              [class.active]="activeTab === 'search'"
              (click)="switchTab('search')"
              [title]="'search' | translate"
            >
              <i class="fas fa-search"></i>
            </button>
            <button
              class="tab-button icon-button"
              [class.active]="activeTab === 'manual'"
              (click)="switchTab('manual')"
              [title]="'manual' | translate"
            >
              <i class="fas fa-th"></i>
            </button>
          </div>
          <div class="sidebar-actions">
            <button 
              class="collapse-sidebar-btn" 
              (click)="toggleSidebarCollapse()" 
              [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
              [title]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            >
              <i class="fas" [class.fa-chevron-left]="!sidebarCollapsed" [class.fa-chevron-right]="sidebarCollapsed"></i>
            </button>
            <button class="close-sidebar-btn" (click)="closeSidebar()" [attr.aria-label]="'closeSidebar' | translate">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="tab-content">
        <!-- Playlist tab: sub-tabs Favorites, Lists, Playlists -->
        <div *ngIf="activeTab === 'playlist'" class="playlist-sub-tabs-container">
          <div class="playlist-sub-tabs">
            <button
              class="sub-tab-button"
              [class.active]="playlistSubTab === 'favorites'"
              (click)="playlistSubTab = 'favorites'"
            >
              <i class="fas fa-heart"></i>
              {{ 'favorites' | translate }}
            </button>
            <button
              class="sub-tab-button"
              [class.active]="playlistSubTab === 'lists'"
              (click)="playlistSubTab = 'lists'"
            >
              <i class="fas fa-list"></i>
              {{ 'lists' | translate }}
            </button>
            <button
              class="sub-tab-button"
              [class.active]="playlistSubTab === 'playlists'"
              (click)="playlistSubTab = 'playlists'"
            >
              <i class="fas fa-clock"></i>
              {{ 'playlist' | translate }}
            </button>
          </div>
          <div class="playlist-sub-tab-content">
            <app-favorites-tab
              *ngIf="playlistSubTab === 'favorites'"
              [refresh$]="listRefresh$"
              (itemClick)="onManualItemSelected($event.item, $event.page)"
            ></app-favorites-tab>
            <app-lists-tab
              *ngIf="playlistSubTab === 'lists'"
              [refresh$]="listRefresh$"
              (itemClick)="onManualItemSelected($event.item, $event.page)"
            ></app-lists-tab>
            <app-playlist-list
              *ngIf="playlistSubTab === 'playlists'"
              [selectedPlaylistGuid]="selectedPlaylistGuid"
              [currentItemGuid]="currentItemGuid"
              [currentPage]="currentPage"
              (playlistSelected)="onPlaylistSelected($event)"
              (playlistItemClick)="onPlaylistItemClick($event)"
              (playlistItemPageClick)="onPlaylistItemPageClick($event)"
              (playlistItemsLoaded)="onPlaylistItemsLoaded($event)"
            ></app-playlist-list>
          </div>
        </div>
        <app-search
          *ngIf="activeTab === 'search'"
          (itemClick)="onManualItemSelected($event.item, $event.page)"
        ></app-search>
        <app-manual
          *ngIf="activeTab === 'manual'"
          (itemClick)="onManualItemSelected($event.item, $event.page)"
        ></app-manual>
      </div>
    </div>
    <div class="content-area-wrapper">
      <div class="content-area" [class.fullscreen]="isFullscreen">
        <!-- List actions button (add to Favorites, lists) -->
        <app-list-actions
          *ngIf="currentContent && currentItemGuid"
          [currentItemGuid]="currentItemGuid"
          (listItemAdded)="onListItemAdded()"
          (listItemRemoved)="onListItemRemoved()"
        ></app-list-actions>

        <!-- Fullscreen button (only shown when not in fullscreen) -->
        <button 
          type="button"
          *ngIf="!isFullscreen && currentContent" 
          class="fullscreen-button" 
          (click)="toggleFullscreen()"
          [title]="'fullscreen' | translate"
          [attr.aria-label]="'fullscreen' | translate"
        >
          <i class="fas fa-expand"></i>
        </button>

        <!-- Exit fullscreen button (only shown when in fullscreen) -->
        <button 
          type="button"
          *ngIf="isFullscreen" 
          class="exit-fullscreen-button" 
          (click)="exitFullscreen()"
          [title]="'exitFullscreen' | translate"
          [attr.aria-label]="'exitFullscreen' | translate"
        >
          <i class="fas fa-compress"></i>
        </button>

        <!-- Chord display toggle and transposition buttons (ToggleChordDisplay permission) -->
        <button 
          *ngIf="currentContent?.type === 'text' && hasToggleChordDisplayPermission()" 
          class="chord-display-button" 
          [class.fullscreen-mode]="isFullscreen"
          (click)="toggleChordDisplay()"
          [title]="getChordDisplayTitle() | translate"
          [attr.aria-label]="getChordDisplayTitle() | translate"
        >
          <i class="fas" [ngClass]="getChordDisplayIcon()"></i>
        </button>

        <button 
          *ngIf="currentContent?.type === 'text' && chordsVisible && hasToggleChordDisplayPermission()" 
          class="chord-size-decrease-button" 
          [class.fullscreen-mode]="isFullscreen"
          (click)="decreaseChordTransposition()"
          [title]="'decreaseChordTransposition' | translate"
          [attr.aria-label]="'decreaseChordTransposition' | translate"
        >
          <i class="fas fa-minus"></i>
        </button>

        <button 
          *ngIf="currentContent?.type === 'text' && chordsVisible && hasToggleChordDisplayPermission()" 
          class="chord-size-increase-button" 
          [class.fullscreen-mode]="isFullscreen"
          (click)="increaseChordTransposition()"
          [title]="'increaseChordTransposition' | translate"
          [attr.aria-label]="'increaseChordTransposition' | translate"
        >
          <i class="fas fa-plus"></i>
        </button>

        <button 
          *ngIf="currentContent?.type === 'text' && chordsVisible && hasToggleChordDisplayPermission()" 
          class="chord-size-reset-button" 
          [class.fullscreen-mode]="isFullscreen"
          [class.disabled]="chordTransposition === 0"
          (click)="resetChordTransposition()"
          [title]="'resetChordTransposition' | translate"
          [attr.aria-label]="'resetChordTransposition' | translate"
          [disabled]="chordTransposition === 0"
        >
          <i class="fas fa-undo"></i>
        </button>

        <!-- Text Content -->
        <div *ngIf="currentContent?.type === 'text'" class="content-container text-container" [ngStyle]="textContainerStyle" [class.chords-hidden]="chordDisplayState === 'hidden'" [class.chords-local]="chordDisplayState === 'local'" [class.chords-everywhere]="chordDisplayState === 'everywhere'" #textContainer>
          <div class="text-content" [ngStyle]="textContentStyle" [innerHTML]="text | formatText"></div>
        </div>

        <!-- Image Content -->
        <div *ngIf="currentContent?.type === 'image'" class="content-container image-container" [ngStyle]="imageContainerStyle" #imageContainer>
          <img [src]="imageSrc" alt="Received image" class="display-image" [ngStyle]="imageStyle" />
        </div>

        <!-- URL Content (iframe with URL) -->
        <div *ngIf="currentContent?.type === 'url'" class="content-container iframe-container">
          <iframe #urlIframe [src]="safeUrl" class="display-iframe" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" tabindex="-1"></iframe>
        </div>

        <!-- iFrame Content (pasted embed code) -->
        <div *ngIf="currentContent?.type === 'iframe'" class="content-container iframe-embed-container">
          <div class="iframe-embed-wrapper" [innerHTML]="safeIframeHtml"></div>
        </div>

        <!-- Video Content -->
        <div *ngIf="currentContent?.type === 'video'" class="content-container video-container" [ngStyle]="videoContainerStyle">
          <video #videoElement [src]="videoSrc" class="display-video" controls [muted]="true"></video>
        </div>

        <!-- No content message -->
        <div *ngIf="!currentContent" class="content-container no-content">
          <div class="waiting-message">{{ 'waitingForContent' | translate }}</div>
        </div>

        <!-- Play/Pause button for URL/iframe/video - controls media playback on client displays -->
        <button
          *ngIf="showUrlPlayPauseButton"
          type="button"
          class="url-play-pause-button"
          [class.adjacent-to-autoplay]="showAutoplayButton"
          [class.playing]="urlVideoPlaying"
          (click)="onUrlPlayPauseClick()"
          [attr.title]="urlVideoPlaying ? ('pause' | translate) : ('play' | translate)"
          [attr.aria-label]="urlVideoPlaying ? ('pause' | translate) : ('play' | translate)"
        >
          <i class="fas" [class.fa-play]="!urlVideoPlaying" [class.fa-pause]="urlVideoPlaying"></i>
        </button>

        <!-- Autoplay button - bottom right, only when item has duration -->
        <button
          *ngIf="showAutoplayButton"
          type="button"
          class="autoplay-button"
          [class.playing]="autoplayPlaying"
          (click)="onAutoplayButtonClick()"
          [attr.title]="autoplayPlaying ? ('autoplayPause' | translate) : ('autoplayStart' | translate)"
          [attr.aria-label]="autoplayPlaying ? ('autoplayPause' | translate) : ('autoplayStart' | translate)"
        >
          <i class="fas" [class.fa-play]="!autoplayPlaying" [class.fa-pause]="autoplayPlaying"></i>
        </button>

        <!-- Autoplay countdown overlay - center -->
        <div *ngIf="autoplayPlaying" class="autoplay-countdown-overlay">
          <div class="autoplay-countdown-content">
            <div
              class="autoplay-countdown-ring"
              [class.countdown-snap]="autoplayProgress >= 0.999"
            >
              <svg class="autoplay-countdown-svg" viewBox="0 0 120 120">
                <circle class="autoplay-countdown-ring-track" cx="60" cy="60" r="52" />
                <circle
                  class="autoplay-countdown-ring-fill"
                  cx="60" cy="60" r="52"
                  [attr.stroke-dasharray]="(2 * Math.PI * 52 * autoplayProgress) + ' ' + (2 * Math.PI * 52)"
                />
              </svg>
              <div class="autoplay-countdown-time">{{ autoplayRemainingSeconds }}</div>
            </div>
          </div>
        </div>

        <!-- Autoplay hide delay overlay - after last page, before content is hidden -->
        <div *ngIf="autoplayHideDelayEndAt != null" class="autoplay-countdown-overlay autoplay-hide-delay-overlay">
          <div class="autoplay-countdown-content">
            <div class="autoplay-hide-delay-label">{{ 'autoplayHidingOnScreenAfter' | translate }}</div>
            <div
              class="autoplay-countdown-ring"
              [class.countdown-snap]="autoplayHideDelayProgress >= 0.999"
            >
              <svg class="autoplay-countdown-svg" viewBox="0 0 120 120">
                <circle class="autoplay-countdown-ring-track" cx="60" cy="60" r="52" />
                <circle
                  class="autoplay-countdown-ring-fill"
                  cx="60" cy="60" r="52"
                  [attr.stroke-dasharray]="(2 * Math.PI * 52 * autoplayHideDelayProgress) + ' ' + (2 * Math.PI * 52)"
                />
              </svg>
              <div class="autoplay-countdown-time">{{ autoplayHideDelayRemainingSeconds }}</div>
            </div>
          </div>
        </div>

        <!-- Overlay when content is hidden from display (not visible to audience) -->
        <div *ngIf="!contentVisible" class="content-hidden-overlay" [attr.aria-label]="'contentHiddenFromDisplay' | translate">
          <span class="content-hidden-label">{{ 'contentHiddenFromDisplay' | translate }}</span>
        </div>
      </div>
      
      <!-- Footer -->
      <div class="footer" [class.hidden]="isFullscreen">
    <div class="footer-info">
      <div class="current-item-info">
        <div class="current-item-guid-badge" *ngIf="currentItemGuid">{{ currentItemGuid }}</div>
        <div class="current-item-name" *ngIf="currentItemName">{{ currentItemName }}</div>
        <div class="current-item-placeholder" *ngIf="!currentItemGuid">{{ 'noItemSelected' | translate }}</div>
      </div>
    </div>
    <!-- Page buttons for text items -->
    <div class="page-buttons-container" *ngIf="getAvailablePages().length > 1">
      <button
        *ngFor="let pageNum of getAvailablePages()"
        class="page-button"
        [class.active]="currentPage === pageNum"
        (click)="onPageButtonClick(pageNum)"
        [title]="('goToPage' | translate) + ' ' + pageNum"
      >
        {{ pageNum }}
      </button>
    </div>
    <div class="footer-actions">
      <button 
        class="footer-button nav-button prev-button" 
        (click)="onPreviousClick()"
        [disabled]="!canGoPrevious()"
        [title]="'previous' | translate"
      >
        <i class="fas fa-chevron-left"></i>
      </button>
      <button 
        class="footer-button visibility-toggle-button"
        [class.visible]="contentVisible"
        [class.hidden]="!contentVisible"
        [disabled]="visibilityToggleDisabled"
        (click)="onVisibilityToggleClick()"
        [attr.title]="contentVisible ? ('hideContent' | translate) : ('showContent' | translate)"
      >
        <i class="fas" [class.fa-eye]="contentVisible" [class.fa-eye-slash]="!contentVisible"></i>
      </button>
      <button 
        class="footer-button nav-button next-button" 
        (click)="onNextClick()"
        [disabled]="!canGoNext()"
        [title]="'next' | translate"
      >
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
