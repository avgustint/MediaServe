# DNS/DHCP Configuration for WiFi Access Point
# This file configures dnsmasq for DHCP and DNS serving on the AP
# Place this file at /etc/dnsmasq.conf (or add to existing dnsmasq.conf)

# Interface to use
interface=wlan0

# Don't read /etc/resolv.conf
no-resolv

# Use Google DNS for upstream queries
server=8.8.8.8
server=8.8.4.4

# DHCP range (adjust IP range as needed)
# This gives IPs from 192.168.4.2 to 192.168.4.20
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# Gateway IP (Raspberry Pi's IP on wlan0)
dhcp-option=3,192.168.4.1

# DNS server IP (Raspberry Pi's IP on wlan0)
dhcp-option=6,192.168.4.1

# Domain name (optional)
domain=local

# Address assignment for specific hostnames (optional)
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.4.10

# Log DHCP requests (useful for debugging)
log-dhcp

# Cache size
cache-size=1000

