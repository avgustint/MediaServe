# WiFi Access Point Configuration for MediaServer
# This file configures hostapd to create a WiFi access point
# Place this file at /etc/hostapd/hostapd.conf on Raspberry Pi

# Interface to use
interface=wlan0

# Driver (nl80211 is preferred for modern WiFi adapters)
driver=nl80211

# SSID (network name)
ssid=mediaplayer

# WiFi mode (a = 5GHz, g = 2.4GHz)
hw_mode=g

# Channel (use 1-11 for 2.4GHz in most countries)
channel=7

# Enable WiFi 802.11n
ieee80211n=1

# Enable WiFi 802.11ac (if supported)
# ieee80211ac=1

# WiFi security mode (WPA2)
wpa=2
wpa_passphrase=mediaplayer123

# WPA key management
wpa_key_mgmt=WPA-PSK

# WPA encryption
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Country code (set according to your location)
# Uncomment and set appropriate country code (e.g., US, GB, DE, etc.)
# country_code=US

# Beacon interval (milliseconds)
beacon_int=100

# Authentication algorithm
auth_algs=1

# WMM (WiFi Multimedia) support
wmm_enabled=1

# Maximum number of stations
max_num_sta=10

